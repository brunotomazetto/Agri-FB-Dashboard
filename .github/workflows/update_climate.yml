name: Update Climate (NASA + RONI)

# Semanal: regenera o history.json (NASA POWER, sem rate limit) dos módulos de
# clima e atualiza a tabela RONI do NOAA. A virada de ano é automática (os
# builders usam Y1 = ano corrente). O ERA5 tem workflow próprio.
#
# É um REBUILD COMPLETO de propósito, não incremental. O POWER revisa os ~30
# dias mais recentes: medido em 03/08/2026, 28 dias de junho mudaram entre o
# build de 02/07 e o de 02/08 (|Δ| médio 0,42 °C, máx 1,30 °C). Um builder que
# só acrescentasse os dias novos congelaria o valor preliminar para sempre —
# daqui a um ano o histórico teria 12 janelas de dado nunca corrigido.
# Rebaixar tudo é o que faz a série convergir para o valor final.
#
# Semanal e não diário por causa do peso no repositório: o history.json tem
# ~12 MB e é commitado a cada execução.
#
# build_history_nasa.py cobre só capitais e fazendas e REESCREVE o history.json
# inteiro — sem o build_regions.py logo em seguida, as 51 regiões produtoras
# somem do arquivo (foi o que aconteceu nos refreshes de jul e ago/2026). A
# ordem dos dois passos é obrigatória, e o passo de sanidade abaixo impede que
# um arquivo sem regiões volte a ser commitado.

on:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda, 09:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180        # as 726 células das regiões levam ~1h no NASA POWER
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh NASA POWER history (Weather + Sugar)
        run: |
          python "Climate Monitor/Weather Monitor/build_history_nasa.py"
          python "Climate Monitor/Sugar Monitor/build_history_nasa.py"

      # Sem cache entre execuções de propósito: o cache de células é resumível
      # por chave, então uma célula já cacheada não voltaria a ser baixada e o
      # ano corrente da região congelaria na data do cache.
      - name: Rebuild region series (Weather)
        run: python "Climate Monitor/Weather Monitor/build_regions.py" nasa

      - name: Sanidade — regiões presentes no history.json
        run: |
          python - <<'PY'
          import json, sys
          h = json.load(open("Climate Monitor/Weather Monitor/history.json", encoding="utf-8"))
          regs = [k for k in h["points"] if "|" in k]
          print(f"{len(h['points'])} pontos, {len(regs)} séries de região")
          if len(regs) < 100:
              sys.exit("history.json sem as séries de região — abortando o commit")
          PY

      - name: Refresh RONI (NOAA CPC)
        run: python "Climate Monitor/update_roni.py"

      - name: Commit e push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Climate Monitor/Weather Monitor/history.json" "Climate Monitor/Sugar Monitor/history.json" "Climate Monitor/roni.json"
          git diff --cached --quiet && { echo "nada a commitar"; exit 0; }
          git commit -m "auto: refresh climate (NASA history + RONI) $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main || true
          git push
