name: Update U.S. Pork Tracker DB

on:
  schedule:
    - cron: '0 7 */3 * *'

  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual update'
      backfill:
        description: 'Force a full MARS API history pull (carcass/hog/corn/sbm, 2015→now) instead of the normal latest-only fetch'
        required: false
        type: boolean
        default: false
      debug_mars:
        description: 'TEMP: dump raw MARS API JSON for reports 2680/2675/3192/3511 (diagnostic only)'
        required: false
        type: boolean
        default: false

jobs:
  update-pork-db:
    name: Refresh pork_us.db
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl pdfplumber

      - name: Debug MARS API (temporary diagnostic)
        if: ${{ inputs.debug_mars }}
        working-directory: 'Pork/U.S. Tracker'
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          python3 - <<'EOF'
          import requests, json, os, re
          from datetime import datetime, timedelta
          key = os.environ.get("USDA_API_KEY", "")
          auth = (key, "") if key else None
          end = datetime.now().strftime("%m/%d/%Y")
          start90 = (datetime.now() - timedelta(days=90)).strftime("%m/%d/%Y")

          # Corn (3192): how far back does the Report Header narrative go, 2015->now?
          print("=== corn (3192) narrative history, 2015-01-01 -> now ===")
          r = requests.get("https://marsapi.ams.usda.gov/services/v1.2/reports/3192",
                            params={"startDate":"01/01/2015","endDate":end,
                                    "allSections":"true","allCommodities":"true"},
                            auth=auth, timeout=60)
          print("status", r.status_code)
          if r.status_code == 200:
              items = r.json()
              items = items.get("results", items) if isinstance(items, dict) else items
              for it in items:
                  if it.get("reportSection") == "Report Header":
                      rows = it.get("results", [])
                      print(f"  Report Header rows: {len(rows)}")
                      dates = sorted(set(x.get("report_date") for x in rows))
                      print("  earliest:", dates[:3], "latest:", dates[-3:])
                      print("  sample narrative:", rows[0].get("report_narrative"))

          # SBM (3511): which commodity string + locations exist in "Report Comprehensive Values"?
          print("\n=== sbm (3511) Report Comprehensive Values — commodities/locations ===")
          r = requests.get("https://marsapi.ams.usda.gov/services/v1.2/reports/3511",
                            params={"startDate": start90, "endDate": end,
                                    "allSections":"true","allCommodities":"true"},
                            auth=auth, timeout=60)
          print("status", r.status_code)
          if r.status_code == 200:
              items = r.json()
              items = items.get("results", items) if isinstance(items, dict) else items
              for it in items:
                  if it.get("reportSection") == "Report Comprehensive Values":
                      rows = it.get("results", [])
                      print(f"  rows: {len(rows)}")
                      soy = [x for x in rows if x.get("commodity") and "soybean meal" in x["commodity"].lower()]
                      print(f"  soybean-meal rows: {len(soy)}")
                      locs = sorted(set((x.get("market_location_name"), x.get("trade_loc")) for x in soy))
                      print("  locations:", locs[:15])
                      if soy:
                          print("  sample:", json.dumps(soy[0], indent=2)[:700])

          # Report catalog — try a text-search style query for hog/carcass
          print("\n=== catalog probes ===")
          for params in [{"q":"hog"}, {"q":"carcass"}, {"category":"Livestock"}]:
              try:
                  r = requests.get("https://marsapi.ams.usda.gov/services/v1.2/reports",
                                    params=params, auth=auth, timeout=30)
                  print(f"  params={params} status={r.status_code} len={len(r.text)}")
                  if r.status_code == 200:
                      cat = r.json()
                      cat_items = cat.get("results", cat) if isinstance(cat, dict) else cat
                      print(f"    {len(cat_items)} items")
                      for it in cat_items[:8]:
                          print("   ", json.dumps(it)[:200])
              except Exception as e:
                  print(f"  ERROR: {e}")
          EOF

      - name: Run extractor_pork_us.py
        working-directory: 'Pork/U.S. Tracker'
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python extractor_pork_us.py --backfill
          else
            python extractor_pork_us.py
          fi
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}

      - name: Verify pork_us.db
        working-directory: 'Pork/U.S. Tracker'
        run: |
          python3 - <<'EOF'
          import sqlite3, os
          db_path = "pork_us.db"
          if not os.path.exists(db_path):
              raise FileNotFoundError("pork_us.db was not created!")
          con = sqlite3.connect(db_path)
          nq = con.execute("SELECT COUNT(*) FROM quarterly").fetchone()[0]
          nw = con.execute("SELECT COUNT(*) FROM weekly").fetchone()[0]
          latest = con.execute(
              "SELECT quarter, spread_integrated, spread_non_integrated, updated_at "
              "FROM quarterly ORDER BY year_q DESC LIMIT 1"
          ).fetchone()
          con.close()
          fmt = lambda v: f"{v:.3f}" if v is not None else "N/A"
          print(f"pork_us.db OK: {nq} quarters, {nw} weekly rows")
          print(f"Latest: {latest[0]} | spread_int={fmt(latest[1])} | spread_nint={fmt(latest[2])}")
          if nq < 20:
              raise ValueError(f"Suspiciously few quarterly rows: {nq}")
          EOF

      - name: Commit updated pork_us.db
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add "Pork/U.S. Tracker/pork_us.db"
          if git diff --staged --quiet; then
            echo "No changes to pork_us.db — skipping commit."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "auto: refresh pork_us.db — ${TIMESTAMP}"
            git push
            echo "pork_us.db committed and pushed."
          fi
