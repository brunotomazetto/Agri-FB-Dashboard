name: Update Aluminum Prices

on:
  schedule:
    # 06:00 UTC, Monday-Friday.
    # Rationale: LME settlement/official prices are published same-day
    # (~12:20-13:25 London time) and Westmetall reflects them shortly
    # after; running early the next UTC morning guarantees the previous
    # full trading day is available from both sources. Weekends are
    # skipped since neither source publishes new data then.
    # Adjust the hour below if you find the data isn't ready yet at this time.
    - cron: "0 6 * * 1-5"
  workflow_dispatch: {}  # allows manual runs from the Actions tab

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-dateutil

      - name: Run daily update script
        working-directory: "Cost Model"
        run: python update_aluminum_prices.py

      - name: Commit and push updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Cost Model/aluminum_prices.db"
          git diff --staged --quiet || git commit -m "Daily update: aluminum spot & future prices ($(date -u +'%Y-%m-%d'))"
          git push
